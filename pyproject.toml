[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postbuch"
version = "0.1.0"
description = "Internal correspondence registry with OIDC auth, IMAP ingestion, and OCR-assisted search."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "authlib>=1.3.2",
  "boto3>=1.35.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "itsdangerous>=2.2.0",
  "pillow>=10.4.0",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.6.1",
  "pdf2image>=1.17.0",
  "pypdf>=5.1.0",
  "python-multipart>=0.0.17",
  "pytesseract>=0.3.13",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.3",
]

[tool.setuptools.packages.find]
include = ["postbuch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
