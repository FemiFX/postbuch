{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:480px;">
  <div class="card-header">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center" style="background:#FBEAEA;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C05656" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
      </div>
      <h1 class="text-base font-semibold text-ink m-0">Fehler</h1>
    </div>
  </div>
  <div class="card-body">
    <p class="text-sm text-ink2 m-0">{{ message }}</p>
  </div>
  <div class="card-footer">
    <a href="/" class="btn-ghost">Zurück zur Startseite</a>
  </div>
</div>
{% endblock %}
