{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Ausgehende Korrespondenz erfassen</h1>
    <p class="page-subtitle">Neuen ausgehenden Vorgang manuell registrieren.</p>
  </div>
</div>

<div class="card" style="max-width:860px;">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <!-- Titel (full width) -->
      <div>
        <label class="form-label" for="title">Titel</label>
        <input class="form-input" id="title" type="text" name="title" placeholder="Titel des Vorgangs" required>
      </div>

      <!-- Datum + Kategorie (two columns) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="form-label" for="entry_date">Datum</label>
          <input class="form-input" id="entry_date" type="date" name="entry_date" value="{{ today }}" required>
        </div>
        <div>
          <label class="form-label" for="category_id">Kategorie</label>
          <select class="form-select" id="category_id" name="category_id">
            <option value="">Keine Kategorie</option>
            {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <!-- Notizen -->
      <div>
        <label class="form-label" for="notes">Notizen</label>
        <textarea class="form-textarea" id="notes" name="notes" placeholder="Optionale interne Notizen …"></textarea>
      </div>

      <!-- File upload -->
      <div>
        <label class="form-label">Datei (optional)</label>
        <label for="upload" class="block border-2 border-dashed border-line-d rounded-xl p-6 text-center cursor-pointer hover:border-brand hover:bg-brand-s transition-colors" id="drop-zone">
          <svg class="mx-auto mb-2 text-muted" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          <p class="text-sm font-medium text-ink m-0" id="drop-label">Datei auswählen oder hierher ziehen</p>
          <p class="text-xs text-muted mt-1 m-0">PDF oder Bild (jpg, png, …)</p>
          <input id="upload" class="hidden" type="file" name="upload" accept=".pdf,image/*"
            onchange="document.getElementById('drop-label').textContent = this.files[0] ? this.files[0].name : 'Datei auswählen oder hierher ziehen'">
        </label>
      </div>
    </form>
  </div>
  <div class="card-footer justify-end">
    <a href="/register" class="btn-ghost">Abbrechen</a>
    <button class="btn" form="new-form" onclick="this.closest('.card').querySelector('form').submit()">Erstellen</button>
  </div>
</div>

<script>
  // Wire the footer button to the form
  document.querySelector('.card-footer .btn').addEventListener('click', function(e) {
    e.preventDefault();
    this.closest('.card').querySelector('form').submit();
  });
</script>
{% endblock %}
